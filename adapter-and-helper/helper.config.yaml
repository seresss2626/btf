# Helper — accepts local TCP connections and tunnels them through the bridge.

bridge:
  url: "wss://YOUR_APIGW_ID.apigw.yandexcloud.net/_helper"
  # Shared secret, identical in the adapter, every helper and the cloud
  # function (AUTH_TOKEN env var). At least 16 characters — generate with:
  #   openssl rand -hex 32
  authToken: "YOUR_AUTH_TOKEN"
  # End-to-end key, identical in the adapter and every helper, and NEVER given
  # to the cloud function. With it, neither the function nor the cloud provider
  # can read or forge your tunnel traffic. Strongly recommended; must differ
  # from authToken. Generate with: openssl rand -hex 32
  e2eKey: "YOUR_E2E_KEY"
  reconnect:
    initialDelayMs: 1000
    maxDelayMs: 30000
    backoffMultiplier: 2.0
  # Periodic PING to refresh IAM token (PONG carries it) and keep the upstream
  # WS alive against API Gateway idle timeout. Pings are gated on a known peer
  # (skipped when no adapter is known), so a helper waiting for an adapter
  # stays cheap.
  pingIntervalMs: 240000

# Local address helper listens on for incoming TCP connections.
listen:
  address: "127.0.0.1:1080"


# Nagle-like write coalescing: buffer small TCP reads into larger DATA frames.
# Reduces wsSend calls and improves throughput. Flush on delayMs timeout or 32KB.
writeCoalescing:
  enabled: true
  delayMs: 50


wsApi:
  mode: "grpc"
  relay: false

logging:
  level: "info"
